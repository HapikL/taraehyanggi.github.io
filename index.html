<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar</title>

    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

    <main class="calendar-app">

        <header class="calendar-header">
    <div>
        <h1>Calendar</h1>
        <p>공유 캘린더</p>
    </div>

    <div class="calendar-controls">
        <button id="prevMonth">‹</button>
        <h2 id="calendarTitle"></h2>
        <button id="nextMonth">›</button>
        <button id="todayButton" class="today-button">오늘</button>

        <button id="loginButton">로그인</button>
        <button id="logoutButton" style="display:none;">로그아웃</button>
    </div>
</header>


        <section class="calendar">

            <div class="weekdays">
                <div class="sunday">일</div>
                <div>월</div>
                <div>화</div>
                <div>수</div>
                <div>목</div>
                <div>금</div>
                <div class="saturday">토</div>
            </div>

            <div id="calendarGrid" class="calendar-grid"></div>

        </section>

    </main>
    
<div id="eventModal" class="modal hidden">
    <div class="modal-content">
        <h3>일정 추가</h3>

        <input id="eventTitle" type="text" placeholder="일정 제목">

        <textarea id="eventDescription" placeholder="상세 내용"></textarea>

        <select id="eventCategory">
            <option value="개인">개인</option>
            <option value="약속">약속</option>
            <option value="취미">취미</option>
            <option value="중요">중요</option>
            <option value="기타">기타</option>
        </select>

        <p id="selectedDateText"></p>

        <div class="modal-buttons">
            <button id="cancelEventButton">취소</button>
            <button id="saveEventButton">저장</button>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js?v=6"></script>

</body>
</html>
