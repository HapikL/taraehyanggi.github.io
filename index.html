<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>나의 홈페이지</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 20px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            color: #666;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>안녕하세요 👋</h1>

        <p>
            이것은 제가 처음 만든 홈페이지입니다.
        </p>

        <a href="#" class="button">
            버튼을 눌러보세요
        </a>
    </div>

</body>
</html>
