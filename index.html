<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar</title>

    <link rel="stylesheet" href="style.css?v=7">
</head>

<body>

    <main class="calendar-app">
<section class="dashboard-row">

    <div class="today-summary-card">

        <div class="today-summary-icon">▣</div>

        <div class="today-summary-content">

            <div class="today-summary-header">
                <strong>오늘 일정</strong>
                <span id="todayDateLabel"></span>
                <span id="todayCountBadge" class="count-badge">0건</span>
            </div>

            <div id="todaySummaryList" class="today-summary-list">
                오늘 일정이 없습니다.
            </div>

        </div>

    </div>

    <div class="category-legend-card">

        <div class="legend-title">🎨 카테고리 색상</div>

        <div class="legend-items">
            <span class="legend-pill legend-bogem">보겜</span>
            <span class="legend-pill legend-meomi">머미</span>
            <span class="legend-pill legend-hyeobchu">협추</span>
            <span class="legend-pill legend-etc">기타</span>
        </div>

    </div>

</section>
        <header class="calendar-header">
    <div>
        <h1>Calendar</h1>
        <p>공유 캘린더</p>
    </div>

    <div class="calendar-controls">
        <button id="prevMonth">‹</button>
        <h2 id="calendarTitle"></h2>
        <button id="nextMonth">›</button>
        <button id="todayButton" class="today-button">오늘</button>

        <button id="loginButton">로그인</button>
        <button id="logoutButton" style="display:none;">로그아웃</button>
    </div>
</header>


        <section class="calendar">

            <div class="weekdays">
                <div class="sunday">일</div>
                <div>월</div>
                <div>화</div>
                <div>수</div>
                <div>목</div>
                <div>금</div>
                <div class="saturday">토</div>
            </div>

            <div id="calendarGrid" class="calendar-grid"></div>

        </section>

    </main>
    
<div id="eventModal" class="modal hidden">
    <div class="modal-content">
<h3 id="eventModalTitle">일정 추가</h3>

       <input
    id="eventTitle"
    type="text"
    placeholder="일정 제목"
>

<div class="form-row two-cols">
    <input
        id="eventTime"
        type="text"
        placeholder="시간 (예: 20:30)"
    >

    <input
        id="eventPeople"
        type="number"
        placeholder="인원"
    >
</div>

<input
    id="eventHost"
    type="text"
    placeholder="방주"
>

<textarea
    id="eventDescription"
    placeholder="상세 내용"
></textarea>

<select id="eventCategory">
    <option value="머미">머미</option>
    <option value="보겜">보겜</option>
    <option value="협추">협추</option>
    <option value="기타">기타</option>
</select>

        <p id="selectedDateText"></p>

  <div class="modal-buttons">

    <button id="deleteEventButton" style="display:none;">
        삭제
    </button>

    <button id="cancelEventButton">
        취소
    </button>

    <button id="saveEventButton">
        저장
    </button>

</div>
    </div>
</div>
<div id="detailModal" class="modal hidden">

    <div class="modal-content detail-modal-content">

        <button id="closeDetailModalButton" class="close-button">
            ×
        </button>

        <span id="detailCategoryBadge" class="detail-category-badge">
            기타
        </span>

        <h3 id="detailTitle" class="detail-title"></h3>

        <div class="detail-table">

            <div class="detail-row">
                <span class="detail-label">날짜</span>
                <span id="detailDate"></span>
            </div>

            <div class="detail-row">
                <span class="detail-label">시간</span>
                <span id="detailTime"></span>
            </div>

            <div class="detail-row">
                <span class="detail-label">인원</span>
                <span id="detailPeople"></span>
            </div>

            <div class="detail-row">
                <span class="detail-label">벙주</span>
                <span id="detailHost"></span>
            </div>

            <div class="detail-row">
                <span class="detail-label">메모</span>
                <span id="detailDescription"></span>
            </div>

        </div>

        <div class="modal-buttons">
            <button id="editFromDetailButton" style="display:none;">
                수정
            </button>
        </div>

    </div>

</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js?v=6"></script>

</body>
</html>
