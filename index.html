<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>공방 캘린더</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css?v=20261125"
    >
</head>


<body>

<main class="calendar-app">


    <!-- ==================================================
         01. 오늘 일정 / 카테고리 색상
    =================================================== -->

    <section class="dashboard-row">

        <!-- 오늘 일정 -->
        <div class="today-summary-card">

            <div class="today-summary-icon">
                ▣
            </div>

            <div class="today-summary-content">

                <div class="today-summary-header">

                    <strong>오늘 일정</strong>

                    <span id="todayDateLabel"></span>

                    <span
                        id="todayCountBadge"
                        class="count-badge"
                    >
                        0건
                    </span>

                </div>

                <div
                    id="todaySummaryList"
                    class="today-summary-list"
                >
                    오늘 일정이 없습니다.
                </div>

            </div>

        </div>


        <!-- 카테고리 색상 -->
        <div class="category-legend-card">

            <div class="legend-title">
                🎨 카테고리 색상
            </div>

            <div class="legend-items">

                <span class="legend-pill legend-bogem">
                    보겜
                </span>

                <span class="legend-pill legend-meomi">
                    머미
                </span>

                <span class="legend-pill legend-hyeobchu">
                    협추
                </span>

                <span class="legend-pill legend-etc">
                    기타
                </span>

            </div>

        </div>

    </section>



    <!-- ==================================================
         02. 도트 예약 페이지 / 달력 컨트롤
    =================================================== -->

    <header class="calendar-header">

        <!-- 도트 예약 페이지 -->
        <a
            href="https://dott-dopamin.github.io/dott/"
            class="dott-reservation-banner"
        >
            <span class="dott-reservation-title">
                🐰 도트 예약 페이지
            </span>

            <span class="dott-reservation-arrow">
                바로가기 ›
            </span>
        </a>


        <!-- 달력 조작 -->
        <div class="calendar-controls">

            <button
                id="prevMonth"
                type="button"
                aria-label="이전 달"
            >
                ‹
            </button>

            <h2 id="calendarTitle"></h2>

            <button
                id="nextMonth"
                type="button"
                aria-label="다음 달"
            >
                ›
            </button>

            <button
                id="todayButton"
                type="button"
                class="today-button"
            >
                오늘
            </button>


            <!-- 로그인 / 로그아웃 / 일정추가 -->
            <div class="auth-actions">

                <button
                    id="loginButton"
                    type="button"
                >
                    로그인
                </button>

                <button
                    id="logoutButton"
                    type="button"
                    style="display:none;"
                >
                    로그아웃
                </button>

                <button
                    id="quickAddEventButton"
                    type="button"
                    style="display:none;"
                >
                    + 일정 추가
                </button>

            </div>
<a
    id="settlementButton"
    href="settlement.html"
    class="settlement-button"
    style="display:none;"
    onclick="
        document
            .getElementById('pageLoading')
            .classList
            .remove('hidden');
    "
>
    🔐 운영 관리
</a>
        </div>

    </header>



    <!-- ==================================================
         03. 카테고리 필터
    =================================================== -->

    <div class="category-filter">

        <button
            class="filter-button active"
            data-category="전체"
            type="button"
        >
            전체
        </button>

        <button
            class="filter-button"
            data-category="머미"
            type="button"
        >
            머미
        </button>

        <button
            class="filter-button"
            data-category="보겜"
            type="button"
        >
            보겜
        </button>

        <button
            class="filter-button"
            data-category="협추"
            type="button"
        >
            협추
        </button>

        <button
            class="filter-button"
            data-category="기타"
            type="button"
        >
            기타
        </button>

    </div>



    <!-- ==================================================
         04. 메인 캘린더
    =================================================== -->

    <section class="calendar">

        <div class="weekdays">

            <div class="sunday">일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div class="saturday">토</div>

        </div>

        <div
            id="calendarGrid"
            class="calendar-grid"
        ></div>

    </section>

</main>



<!-- ==================================================
     05. 로그인 팝업
=================================================== -->

<div
    id="loginModal"
    class="modal hidden"
>

    <div class="modal-content login-modal-content">

        <button
            id="closeLoginButton"
            class="close-button"
            type="button"
        >
            ×
        </button>

        <h3 class="login-title">
            관리자 로그인
        </h3>

        <p class="login-description">
            일정 관리를 위해 로그인해주세요.
        </p>


        <label
            class="form-label"
            for="loginEmail"
        >
            이메일
        </label>

        <input
            id="loginEmail"
            type="email"
            placeholder="이메일 주소"
            autocomplete="email"
        >


        <label
            class="form-label"
            for="loginPassword"
        >
            비밀번호
        </label>

        <div class="password-field">

            <input
                id="loginPassword"
                type="password"
                placeholder="비밀번호"
                autocomplete="current-password"
            >

            <button
                id="togglePasswordButton"
                class="password-toggle"
                type="button"
            >
                보기
            </button>

        </div>


        <p
            id="loginErrorMessage"
            class="login-error"
        ></p>

        <button
            id="submitLoginButton"
            class="login-submit-button"
            type="button"
        >
            로그인
        </button>

    </div>

</div>



<!-- ==================================================
     06. 일정 추가 / 수정 팝업
=================================================== -->

<div
    id="eventModal"
    class="modal hidden"
>

    <div class="modal-content">

        <h3 id="eventModalTitle">
            일정 추가
        </h3>


        <!-- 날짜 -->
        <label
            class="form-label"
            for="eventDate"
        >
            날짜
        </label>

        <input
            id="eventDate"
            type="date"
        >


        <!-- 제목 -->
        <input
            id="eventTitle"
            type="text"
            placeholder="일정 제목"
        >


        <!-- 시간 / 인원 -->
        <div class="form-row two-cols">

            <input
                id="eventTime"
                type="text"
                placeholder="시간 (예: 20:30)"
            >

            <input
                id="eventPeople"
                type="number"
                min="0"
                placeholder="인원"
            >

        </div>


        <!-- 벙주 -->
        <input
            id="eventHost"
            type="text"
            placeholder="벙주"
        >


        <!-- 상세 내용 -->
        <textarea
            id="eventDescription"
            placeholder="상세 내용"
        ></textarea>


        <!-- 카테고리 -->
        <select id="eventCategory">

            <option value="머미">머미</option>
            <option value="보겜">보겜</option>
            <option value="협추">협추</option>
            <option value="기타">기타</option>

        </select>


        <!-- 유목민 여부 -->
        <select id="eventNomad">
    <option value="X" selected>
        X - 공방 고유 일정
    </option>

    <option value="O">
        O - 도트에서 넘어온 일정
    </option>
</select>


        <p id="selectedDateText"></p>


        <div class="modal-buttons">

            <button
                id="deleteEventButton"
                class="danger-button"
                type="button"
                style="display:none;"
            >
                삭제
            </button>

            <button
                id="cancelEventButton"
                type="button"
            >
                취소
            </button>

            <button
                id="saveEventButton"
                class="primary-button"
                type="button"
            >
                저장
            </button>

        </div>

    </div>

</div>



<!-- ==================================================
     07. 일정 상세보기 팝업
=================================================== -->

<div
    id="detailModal"
    class="modal hidden"
>

    <div class="modal-content detail-modal-content">

        <button
            id="closeDetailModalButton"
            class="close-button"
            type="button"
        >
            ×
        </button>


        <span
            id="detailCategoryBadge"
            class="detail-category-badge"
        >
            기타
        </span>


        <h3
            id="detailTitle"
            class="detail-title"
        ></h3>


        <div class="detail-table">

            <div class="detail-row">

                <span class="detail-label">
                    날짜
                </span>

                <span id="detailDate"></span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    시간
                </span>

                <span id="detailTime"></span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    인원
                </span>

                <span id="detailPeople"></span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    벙주
                </span>

                <span id="detailHost"></span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    메모
                </span>

                <span id="detailDescription"></span>

            </div>

        </div>


        <div class="modal-buttons">

            <!-- 누구나 사용 가능 -->
            <button
                id="addToCalendarButton"
                type="button"
            >
                📅 캘린더에 저장
            </button>

            <!-- 관리자만 표시 -->
            <button
                id="editFromDetailButton"
                class="primary-button"
                type="button"
                style="display:none;"
            >
                수정
            </button>

        </div>

    </div>

</div>

<!-- ==================================================
     08. 페이지 이동 로딩
=================================================== -->

<div
    id="pageLoading"
    class="page-loading hidden"
>
    <div class="page-loading-box">

        <div class="page-loading-spinner"></div>

        <strong>
            운영관리로 이동 중...
        </strong>

        <span>
            잠시만 기다려주세요.
        </span>

    </div>
</div>


<!-- ==================================================
     09. JavaScript
=================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="script.js?v=20261126"></script>

</body>
</html>
